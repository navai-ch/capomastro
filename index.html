<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyColor Gestionale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: ufficio = sidebar + topbar (ricerca, +, notifiche, profilo) + pagina; operaio = cornice telefono con tab bar. Brand MyColor: rosso #CD2527, grigi caldi, Raleway per i titoli. */
:root{
  --brand:#CD2527; --brand-dark:#8C060D; --brand-soft:#FBE9E9;
  --bg:#F5F3F2; --surface:#FFFFFF; --surface-2:#FAF8F8; --line:#E6E1E0;
  --ink:#1F2024; --ink-2:#4E5058; --muted:#8A8D96;
  --good:#1E8E4E; --good-soft:#E3F3E9; --warn:#C77A08; --warn-soft:#FBF0DC; --bad:#B8232A; --bad-soft:#FBE4E5; --info:#2F66AD; --info-soft:#E4ECF8;
  --s1:#CD2527; --s2:#2F66AD; --s3:#C77A08; --s4:#1E8E4E; --s5:#7B5EA7;
  --display:'Raleway',system-ui,sans-serif; --body:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(31,32,36,.06),0 4px 14px rgba(31,32,36,.06); --shadow-lg:0 8px 30px rgba(31,32,36,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#E8535A; --brand-dark:#CD2527; --brand-soft:#3A1E20;
  --bg:#141518; --surface:#1E1F24; --surface-2:#25262C; --line:#2F3038;
  --ink:#ECEBE9; --ink-2:#C3C4CA; --muted:#8C8F99;
  --good:#4CC27A; --good-soft:#15301F; --warn:#E6A23C; --warn-soft:#33270F; --bad:#F06B72; --bad-soft:#3A1A1D; --info:#5B93DC; --info-soft:#17263A;
  --s1:#E8535A; --s2:#5B93DC; --s3:#E6A23C; --s4:#4CC27A; --s5:#A98AD6; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); --shadow-lg:0 8px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#E8535A; --brand-dark:#CD2527; --brand-soft:#3A1E20;
  --bg:#141518; --surface:#1E1F24; --surface-2:#25262C; --line:#2F3038;
  --ink:#ECEBE9; --ink-2:#C3C4CA; --muted:#8C8F99;
  --good:#4CC27A; --good-soft:#15301F; --warn:#E6A23C; --warn-soft:#33270F; --bad:#F06B72; --bad-soft:#3A1A1D; --info:#5B93DC; --info-soft:#17263A;
  --s1:#E8535A; --s2:#5B93DC; --s3:#E6A23C; --s4:#4CC27A; --s5:#A98AD6; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); --shadow-lg:0 8px 30px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem;font-weight:700}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--info)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--brand);margin:0}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--info);outline-offset:1px}
label{font-size:.8rem;font-weight:600;color:var(--ink-2);display:block;margin-bottom:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.82rem}.b{font-weight:600}.right{text-align:right}.center{text-align:center}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid2>*,.grid3>*{min-width:0}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}.gcrm{display:grid;grid-template-columns:300px 1fr;gap:14px}.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px}
.g21>*,.gcrm>*,.g12>*{min-width:0}
@media (max-width:900px){.g21,.gcrm,.g12{grid-template-columns:1fr}}
.sidebar img,.login-card img,.phone-head img,.mobilebar img{background:#fff;border-radius:8px;padding:5px 8px;box-sizing:content-box}
.hide{display:none!important}
/* Icone SVG: ereditano il colore, si dimensionano in base al contesto */
.ic-svg{width:1.1em;height:1.1em;vertical-align:-.22em;flex:none}
.btn .ic-svg{width:16px;height:16px}.btn.xl .ic-svg{width:20px;height:20px}
.act-ic .ic-svg{width:16px;height:16px;color:var(--ink-2)}
.alert>span:first-child .ic-svg{width:17px;height:17px;margin-top:2px}
h1 .ic-svg,h2 .ic-svg,h3 .ic-svg{width:1em;height:1em;vertical-align:-.12em}
button,.btn,.iconbtn,.nav button,.tabs button,.subtabs button,.chips button,.chat .list button,.tabbar button,.dropdown .it,.listrow.click,.card,.kpi,.alert,.account,.cal .ev,.plan .cell,.sugg button,.mobilebar button,.profbtn{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .12s ease}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:420px;padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.login-card img{width:160px;align-self:flex-start}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:600}
.ms-btn:hover{background:var(--surface-2)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.accounts{display:flex;flex-direction:column;gap:6px}
.account{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.account:hover{border-color:var(--brand);background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-family:var(--display);font-size:.85rem;flex:none}
.avatar.g{background:var(--info)}.avatar.o{background:var(--ink-2)}.avatar.sm{width:26px;height:26px;font-size:.65rem}.avatar.xs{width:22px;height:22px;font-size:.58rem}

/* Shell ufficio */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100%}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.sidebar img{width:140px;margin:0 8px 10px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-weight:500;color:var(--ink-2)}
.nav button:hover{background:var(--surface-2);color:var(--ink);transform:translateX(2px)}
.nav button.on{background:var(--brand-soft);color:var(--brand-dark);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav button .ic{width:20px;height:20px;display:grid;place-items:center;color:var(--muted)}
.nav button .ic .ic-svg{width:18px;height:18px}
.nav button:hover .ic,.nav button.on .ic{color:var(--brand)}
.nav .cnt{margin-left:auto;background:var(--brand);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.nav .sep{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px}
.sideuser{margin-top:auto;padding:10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar img{display:none;height:28px;background:#fff;border-radius:6px;padding:3px 6px;box-sizing:content-box}
.search{position:relative;flex:1;max-width:560px}
.search input{padding-left:38px;border-radius:999px;background:var(--surface-2);transition:border-color .15s,background .15s,box-shadow .15s}
.search input:hover{border-color:var(--muted)}
.search input:focus{background:var(--surface);box-shadow:0 0 0 4px var(--brand-soft);border-color:var(--brand);outline:none}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:grid}
.search .ico .ic-svg{width:17px;height:17px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.dropdown{position:absolute;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;min-width:260px;overflow:hidden}
.dropdown.r{right:0}.dropdown.l{left:0;width:100%;max-width:560px}
.dropdown .hd{padding:8px 12px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
.dropdown .it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.dropdown .it:last-child{border-bottom:0}
.dropdown .it:hover,.dropdown .it.on{background:var(--surface-2)}
.dropdown .it .ic{width:24px;text-align:center;color:var(--muted)}
.dropdown .it .sub{font-size:.78rem;color:var(--muted)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:1.05rem;flex:none}
.iconbtn .ic-svg{width:19px;height:19px}
.iconbtn:hover{background:var(--surface-2);border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.iconbtn:active{transform:translateY(0) scale(.96)}
.iconbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(205,37,39,.25)}
.iconbtn.primary .ic-svg{width:20px;height:20px;stroke-width:2.5}
.iconbtn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff;box-shadow:0 4px 12px rgba(205,37,39,.35)}
.iconbtn .dot{position:absolute;top:-2px;right:-2px;background:var(--brand);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.profbtn{display:flex;align-items:center;gap:4px;border:1px solid transparent;background:none;cursor:pointer;padding:2px 6px 2px 2px;border-radius:999px}
.profbtn:hover,.profbtn.on{background:var(--surface-2);border-color:var(--line)}
.profbtn .avatar{transition:box-shadow .15s}
.profbtn:hover .avatar,.profbtn.on .avatar{box-shadow:0 0 0 3px var(--brand-soft)}
.profbtn .chev{display:grid;color:var(--muted)}
.profbtn .chev .ic-svg{width:14px;height:14px;transition:transform .15s}
.profbtn.on .chev .ic-svg{transform:rotate(180deg)}
.content{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead>div:first-child{min-width:0}
.mobilebar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar img{display:block}
  .search .kbd{display:none}
  .mobilebar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .mobilebar::-webkit-scrollbar{display:none}
  .mobilebar button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.82rem;white-space:nowrap}
  .mobilebar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .content{padding-block:14px 90px}
}

/* Cards, KPIs, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin-bottom:10px}
.card .cardhd{padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .cardhd h3{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--display);font-size:1.45rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v.good{color:var(--good)}.kpi .v.bad{color:var(--bad)}.kpi .v.warn{color:var(--warn)}
.kpi .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.wrap,th.wrap{white-space:normal;min-width:200px}
td.ck,th.ck{width:36px;padding-right:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--brand-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.brand{background:var(--brand-soft);color:var(--brand-dark);border-color:transparent}
.chip{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);margin:2px 3px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);box-shadow:0 3px 10px rgba(205,37,39,.28)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.good:hover{filter:brightness(1.08);box-shadow:0 3px 10px rgba(30,142,78,.28)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--surface-2);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.block{width:100%}
.btn.xl{padding:16px;font-size:1.05rem;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:.9rem;border:1px solid transparent}
.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.good{background:var(--good-soft);color:var(--good)}.alert.info{background:var(--info-soft);color:var(--info)}
.alert .t{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--info);border-radius:999px}
.progress.brand>i{background:var(--brand)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--surface-2);border-radius:8px 8px 0 0}
.tabs button.on{color:var(--brand-dark);border-color:var(--brand)}
.tabs button .ic-svg{width:15px;height:15px;margin-right:2px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.subtabs button:hover{border-color:var(--ink);background:var(--surface-2)}
.subtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs button .ic-svg{width:15px;height:15px;margin-right:3px}
.card[data-act]{cursor:pointer}
.card[data-act]:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi:hover{box-shadow:var(--shadow)}
.alert[data-act]:hover{transform:translateX(3px);box-shadow:var(--shadow)}
.dropdown .it .ic{display:grid;place-items:center}.dropdown .it .ic .ic-svg{width:17px;height:17px}
.cal .ev:hover{box-shadow:var(--shadow);filter:saturate(1.2);z-index:2}
.chat .list button:hover{background:var(--surface-2)}
.sugg button:hover{background:var(--brand-soft);color:var(--brand-dark)}
.mobilebar button:hover{border-color:var(--brand);color:var(--brand-dark)}
.account:hover{transform:translateX(2px)}
.bigbtn:hover{filter:brightness(1.06);box-shadow:var(--shadow-lg)}.bigbtn:active{transform:scale(.99)}
.ai-fab .ic-svg{width:26px;height:26px}.ai-fab:hover{transform:scale(1.07)}
.voice .mic .ic-svg{width:24px;height:24px}.voice .mic:hover{background:var(--brand-dark)}
.tabbar button .ic{display:grid;place-items:center;height:24px}.tabbar button .ic .ic-svg{width:22px;height:22px}
.tabbar button:hover{color:var(--ink-2)}.tabbar button.on .ic-svg{stroke-width:2.4}
.chips button:hover{border-color:var(--brand);color:var(--brand-dark)}
.pill .ic-svg{width:12px;height:12px}
.listrow .btn.ghost .ic-svg{width:15px;height:15px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:.86rem}
.bar .trk{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar .trk>i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.78rem;overflow-x:auto;margin:0;line-height:1.4}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px}
.modal.wide{max-width:960px}.modal.narrow{max-width:460px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:70;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{font-family:var(--body);fill:var(--ink-2);font-size:11px}
.svgchart .grid{stroke:var(--line)}
.svgchart .ref{stroke:var(--ink-2);stroke-dasharray:4 3}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.listrow>*{min-width:0}
.listrow.click{cursor:pointer}.listrow.click:hover{background:var(--surface-2);margin:0 -8px;padding-inline:8px;border-radius:6px}
.selbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:var(--bg);border-radius:10px;flex-wrap:wrap;position:sticky;top:64px;z-index:15}
.selbar .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.3)}
.selbar .btn:hover{background:rgba(255,255,255,.12)}
.selbar .btn.danger{color:#ffb3b7;border-color:#ffb3b7}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--surface-2);cursor:pointer;position:relative}
.dropzone:hover{border-color:var(--brand)}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.scan{height:6px;background:var(--line);border-radius:999px;overflow:hidden;position:relative}
.scan::after{content:"";position:absolute;left:0;top:0;bottom:0;width:40%;background:var(--brand);border-radius:999px;animation:scan 1.1s linear infinite}
@keyframes scan{from{left:-40%}to{left:100%}}
.conf{font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--good-soft);color:var(--good)}
.conf.mid{background:var(--warn-soft);color:var(--warn)}
.pos-editor table input{padding:5px 7px;font-size:.85rem}
.actlist .listrow{align-items:flex-start}
.act-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}

/* Calendario settimanale */
.cal{display:grid;grid-template-columns:52px repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:.8rem}
.cal .hd{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface-2);font-weight:600}
.cal .hd.today{color:var(--brand-dark);background:var(--brand-soft)}
.cal .hd small{display:block;font-weight:500;color:var(--muted)}
.cal .col{position:relative;border-left:1px solid var(--line);height:660px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,var(--line) 59px,var(--line) 60px)}
.cal .hours{position:relative;height:660px}
.cal .hours span{position:absolute;right:6px;transform:translateY(-50%);color:var(--muted);font-size:.72rem}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;font-size:.74rem;line-height:1.2;overflow:hidden;cursor:pointer;border-left:3px solid;background:var(--info-soft);color:var(--ink);border-color:var(--info)}
.cal .ev.Sopralluogo{background:var(--warn-soft);border-color:var(--warn)}.cal .ev.Consegna{background:var(--good-soft);border-color:var(--good)}.cal .ev.Chiamata{background:var(--brand-soft);border-color:var(--brand)}.cal .ev.Interno,.cal .ev.Assenza{background:var(--surface-2);border-color:var(--muted)}.cal .ev.Cantiere{background:var(--brand-soft);border-color:var(--brand-dark)}
.cal .ev b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calwrap{overflow-x:auto}
.calwrap .cal{min-width:760px}

/* Chat / messaggi */
.chat{display:grid;grid-template-columns:260px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-height:520px;max-height:72vh}
.chat .list{border-right:1px solid var(--line);overflow:auto}
.chat .list button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left}
.chat .list button.on{background:var(--brand-soft)}
.chat .list button .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .list button .p{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .thread{display:flex;flex-direction:column;min-width:0}
.chat .thread .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;display:flex;gap:8px;align-items:flex-end}
.msg .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:.92rem}
.msg .meta{font-size:.72rem;color:var(--muted);margin-bottom:2px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:14px 14px 4px 14px}
.msg.me .meta{text-align:right}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer input{border-radius:999px}
@media (max-width:760px){.chat{grid-template-columns:1fr}.chat .list{display:none}.chat.list-open .list{display:block}.chat.list-open .thread{display:none}}

/* Assistente IA */
.ai-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:0;cursor:pointer;font-size:1.4rem;box-shadow:var(--shadow-lg);z-index:45;display:grid;place-items:center}
.ai-fab:hover{background:var(--brand-dark)}
.ai-panel{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:380px;max-width:calc(100vw - 36px);height:560px;max-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);z-index:46;display:flex;flex-direction:column;overflow:hidden}
.ai-panel .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2)}
.ai-panel .msgs{font-size:.9rem}
.ai-panel .msg{max-width:92%}
.ai-panel .bub a,.ai-panel .bub button.lnk{color:var(--info);background:none;border:0;padding:0;cursor:pointer;font:inherit;text-decoration:underline}
.msg.me .bub button.lnk{color:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.78rem;cursor:pointer}
.sugg button:hover{border-color:var(--brand)}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* Pianificazione */
.plan{display:grid;grid-template-columns:200px repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.8rem;background:var(--surface);min-width:760px}
.plan>div{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:54px}
.plan .ph{background:var(--surface-2);font-weight:600;text-align:center}
.plan .pr{font-weight:600;background:var(--surface-2)}
.plan .cell{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;cursor:pointer}
.plan .cell:hover{background:var(--surface-2)}
.plan .cell.today{background:var(--brand-soft)}
.planwrap{overflow-x:auto}

/* Operaio (telefono) */
.phone-wrap{min-height:100%;display:flex;justify-content:center;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.phone{width:100%;max-width:440px;min-width:0;min-height:100vh;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);overflow-x:clip;position:relative}
.phone-body>*{min-width:0}.row>*{min-width:0}
.phone-head{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:5}
.phone-head img{height:26px}
.phone-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:90px}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabbar button{border:0;background:none;padding:9px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);position:relative}
.tabbar button .ic{font-size:1.25rem}
.tabbar button.on{color:var(--brand)}
.tabbar button .dot{position:absolute;top:6px;right:calc(50% - 16px);background:var(--brand);color:#fff;font-size:.58rem;border-radius:999px;min-width:14px;height:14px;display:grid;place-items:center;font-weight:700}
.clock{font-family:var(--display);font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.mapbox svg{display:block;width:100%;height:auto}
.gpsok{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--good-soft);color:var(--good);border-radius:8px;font-weight:600;font-size:.9rem}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;padding:22px;border-radius:16px;border:0;background:var(--brand);color:#fff;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.3rem;box-shadow:var(--shadow)}
.bigbtn.out{background:var(--ink)}.bigbtn.blue{background:var(--info)}.bigbtn.green{background:var(--good)}
.bigbtn small{font-family:var(--body);font-weight:500;font-size:.8rem;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.chips button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark);font-weight:600}
.voice{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.voice .mic{width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:1.4rem;cursor:pointer;flex:none;display:grid;place-items:center;position:relative}
.voice .mic.on::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--brand);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.85);opacity:.7}to{transform:scale(1.35);opacity:0}}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:4px;background:var(--brand);border-radius:2px;animation:wave .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{height:6px}50%{height:22px}}
.transcript{font-style:italic;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem}

/* Anteprima stampa (offerta / fattura) */
.doc{background:#fff;color:#1F2024;padding:28px;border:1px solid var(--line);border-radius:8px;font-size:.88rem}
.doc h2{color:#1F2024}
.doc table{font-size:.84rem}.doc th{background:#f3f1f0;color:#555}.doc td,.doc th{border-color:#e6e1e0}
.doc .qr{width:120px;height:120px;border:1px solid #999;display:grid;place-items:center;font-size:.7rem;color:#555;background:repeating-linear-gradient(45deg,#fff 0 4px,#ddd 4px 6px)}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;inset:0;padding:0}.modal{box-shadow:none;max-height:none}.doc{border:0}}


/* Profilo in basso a sinistra (cliccabile) e menu verso l'alto */
.sideuser{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:1px solid transparent;border-top:1px solid var(--line);background:none;cursor:pointer;border-radius:10px;text-align:left}
.sideuser:hover,.sideuser.on{background:var(--surface-2);border-color:var(--line)}
.sideuser .chev{margin-left:auto;display:grid;color:var(--muted)}.sideuser .chev .ic-svg{width:14px;height:14px;transition:transform .15s}.sideuser.on .chev .ic-svg{transform:rotate(180deg)}
.sideuser:hover .avatar,.sideuser.on .avatar{box-shadow:0 0 0 3px var(--brand-soft)}
.dropdown.up{top:auto;bottom:calc(100% + 6px);left:0;right:auto}
/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:320px;scroll-snap-align:start;transition:border-color .15s,background .15s}
.kcol.over{border-color:var(--brand);background:var(--brand-soft)}
.kcol.lost{background:var(--bad-soft);opacity:.9}
.khd{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s,transform .12s}
.kcard:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.kcard.dragging{opacity:.45;transform:rotate(1.5deg)}
.kcard .kmv{display:flex;justify-content:space-between;margin-top:6px}.kcard .kmv .btn{padding:2px 10px;font-size:1rem;line-height:1}
.kempty{color:var(--muted);font-size:.8rem;text-align:center;padding:24px 0;border:1px dashed var(--line);border-radius:8px}
@media (hover:hover){.kcard .kmv{opacity:.35}.kcard:hover .kmv{opacity:1}}
/* Pagina firma cliente e pad */
.firma-page{min-height:100%;background:var(--bg)}
.firma-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.firma-hd img{height:30px;background:#fff;border-radius:6px;padding:3px 6px;box-sizing:content-box}
.firma-main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.sigpad{width:100%;height:auto;aspect-ratio:560/180;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair;display:block}
.sigtype{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 18px;color:#1a2340}
.cursive{font-family:'Brush Script MT','Segoe Script','Snell Roundhand','Apple Chancery',cursive;font-style:italic;font-weight:700;font-size:1.7rem;color:#1a2340;line-height:1.2}
.doc .sigblock{border-top:1px solid #e6e1e0;padding-top:14px}
.doc input[type=checkbox]{width:18px;height:18px}
.demo-note{font-size:.75rem;color:var(--muted);text-align:center;padding:8px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}

/* ---- v6: logo, tema, tooltip, dashboard, listino, inbox, account, assistente operaio ---- */
.logo{border:0;background:none;padding:0;cursor:pointer;display:block;border-radius:8px;flex:none}.logo:hover img{box-shadow:0 0 0 3px var(--brand-soft)}.sidebar .logo{margin-bottom:6px}.logo img{transition:box-shadow .15s ease}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}.seg button{border:0;background:none;padding:4px 9px;font-size:.74rem;font-weight:600;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center;font-family:inherit}.seg button .ic-svg{width:13px;height:13px}.seg button:hover{background:var(--surface-2)}.seg button.on{background:var(--ink);color:var(--bg)}
.tip{position:fixed;z-index:200;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:.78rem;line-height:1.4;pointer-events:none;box-shadow:var(--shadow-lg);max-width:300px;white-space:pre-line;opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease}.tip.on{opacity:1;transform:none}
.kpi{position:relative}.kpi.click{cursor:pointer}.kpi.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--brand)}.kpi .go{position:absolute;right:8px;bottom:10px;opacity:0;transition:opacity .15s,transform .15s;transform:rotate(-90deg) translateY(4px);color:var(--brand)}.kpi.click:hover .go{opacity:1;transform:rotate(-90deg)}.kpi .go .ic-svg{width:16px;height:16px}
.spark{width:64px;height:22px;flex:none;opacity:.9}
.svgchart .hb{cursor:pointer}.svgchart .hb rect{transition:opacity .15s ease,filter .15s ease}.svgchart:hover .hb rect{opacity:.5}.svgchart .hb:hover rect{opacity:1!important;filter:brightness(1.12)}.svgchart .hb .lab{opacity:0;font-weight:700;fill:var(--ink);transition:opacity .15s}.svgchart .hb:hover .lab{opacity:1}
.funnel{display:flex;flex-direction:column;gap:4px}.fstep{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:background .15s,transform .15s}.fstep:hover{background:var(--surface-2);transform:translateX(3px)}.fstep .bar{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:block}.fstep .bar i{display:block;height:100%;border-radius:3px;transition:width .3s}.fstep .n{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aging{display:flex;flex-direction:column;gap:4px}.aging .arow{display:grid;grid-template-columns:96px 1fr 96px;gap:10px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:background .15s,transform .15s}.aging .arow:hover{background:var(--surface-2);transform:translateX(3px)}
.bar .trk>i{transition:filter .15s}.bar .trk>i:hover{filter:brightness(1.15)}
.team-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s,transform .15s}.team-row:hover{background:var(--surface-2);transform:translateX(3px)}.avstack{display:inline-flex}.avstack .avatar{width:24px;height:24px;font-size:.58rem;margin-left:-7px;border:2px solid var(--surface)}.avstack .avatar:first-child{margin-left:0}
.g3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}.g3>*{min-width:0}@media (max-width:1180px){.g3{grid-template-columns:1fr 1fr}.g3>*:first-child{grid-column:1/-1}}@media (max-width:760px){.g3{grid-template-columns:1fr}.g3>*:first-child{grid-column:auto}}
.lpanel{border:1px solid var(--brand);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}.chips.sm button{padding:3px 9px;font-size:.76rem}.llist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}.lrow{display:grid;grid-template-columns:86px 1fr 110px 130px;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:background .12s}.lrow:last-child{border-bottom:0}.lrow:hover{background:var(--brand-soft)}.lrow .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media (max-width:700px){.lrow{grid-template-columns:1fr 90px}.lrow>.num.muted,.lrow>.small{display:none}}
.mail{display:grid;grid-template-columns:200px 360px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);height:calc(100vh - 215px);min-height:560px}
.mnav{border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
